# Gera os instaladores do PBS para Windows, macOS e Linux em computadores do GitHub.
# Roda sozinho a cada envio para a branch main, ou manualmente em Actions → "Instaladores desktop" → Run workflow.
# Os arquivos ficam em "Artifacts" no fim de cada execução. Ao criar uma tag v*, eles também viram uma Release.
#   Windows: .exe (instalador NSIS) e .msi
#   macOS:   .dmg (sem assinatura da Apple: na 1ª abertura, clique com o botão direito → Abrir)
#   Linux:   .AppImage e .deb
name: Instaladores desktop

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            files: |
              src-tauri/target/release/bundle/nsis/*.exe
              src-tauri/target/release/bundle/msi/*.msi
          - os: macos-latest
            name: macos
            files: |
              src-tauri/target/release/bundle/dmg/*.dmg
          - os: ubuntu-22.04
            name: linux
            files: |
              src-tauri/target/release/bundle/appimage/*.AppImage
              src-tauri/target/release/bundle/deb/*.deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Dependências do sistema (Linux)
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev libayatana-appindicator3-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Instalar dependências
        run: npm ci

      - name: Testes do motor
        if: matrix.name == 'windows'
        run: npx vitest run

      - name: Gerar instalador
        run: npm run desktop:build

      - name: Publicar instaladores
        uses: actions/upload-artifact@v4
        with:
          name: PBS-instalador-${{ matrix.name }}
          path: ${{ matrix.files }}

      - name: Anexar à Release (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.files }}
